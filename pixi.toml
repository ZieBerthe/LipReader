[workspace]
channels = ["conda-forge"]
name = "LipReader"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
# Data
download = { cmd = "python -m lipreader.data.download", description = "Download GRID speaker s1 into data/" }
cache = { cmd = "python -m lipreader.data.cache", description = "Extract and cache mouth crops for every clip" }
preview = { cmd = "python -m lipreader.data.dataset", description = "Print a batch and save a mouth-crop GIF to outputs/" }
# Lip reading (video -> text)
train-lipreader = { cmd = "python -m lipreader.lipreading.train", description = "Train the CTC lip reader" }
# Video-style TTS (text + video -> speech)
tts-prep = { cmd = "python -m lipreader.tts.prep", description = "Extract mels + mouth frames for TTS" }
tts-train = { cmd = "python -m lipreader.tts.train", description = "Train the video-style TTS" }
tts-infer = { cmd = "python -m lipreader.tts.infer", description = "Synthesise a wav from text and/or video" }
# Lip-to-speech v2 (video -> speech with flow matching + HiFi-GAN)
download-vocoder = { cmd = "python -m lipreader.vocoder", description = "Download the pretrained HiFi-GAN (UNIVERSAL_V1)" }
v2s-prep = { cmd = "python -m lipreader.v2s.data", description = "Extract HiFi-GAN log-mels + normalisation stats into data/mels/" }
v2s-train = { cmd = "python -m lipreader.v2s.train", description = "Train the lip-to-speech flow-matching model" }
v2s-sample = { cmd = "python -m lipreader.v2s.sample", description = "Generate speech for validation clips or a --video" }

[dependencies]
python = "==3.10"
pip = "*"
gdown = ">=5.2.1,<6"
tqdm = ">=4.67.3,<5"
setuptools = ">=82.0.1,<83"
ffmpeg = "*"  # librosa reads the audio track of the .mpg files through ffmpeg

[pypi-dependencies]
torch = ">=2.5.0"
torchvision = "*"
opencv-python = ">=4.10.0"
mediapipe = ">=0.10.32, <0.11"
soundfile = "*"
numpy = "*"
matplotlib = "*"
librosa = "*"
imageio = "*"
tqdm = "*"
